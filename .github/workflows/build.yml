name: Build STB UEFI Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout STB Repository
        uses: actions/checkout@v4
        with:
          path: STBPkg

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git uuid-dev iasl nasm python3

      - name: Clone Tianocore EDK II
        run: |
          git clone --depth 1 https://github.com/tianocore/edk2.git edk2-src
          cd edk2-src
          git submodule update --init --depth 1

      - name: Move STB into EDK II Workspace
        run: |
          mkdir -p edk2-src/STBPkg
          cp -r STBPkg/* edk2-src/STBPkg/

      - name: Build BaseTools and Compile Firmware
        run: |
          cd edk2-src
          make -C BaseTools
          . edksetup.sh
          build -p STBPkg/STBPkg.dsc -a X64 -t GCC5 -b DEBUG

      - name: Upload Firmware Artifact (.fd)
        uses: actions/upload-artifact@v4
        with:
          name: STB-Firmware-ROM
          path: edk2-src/Build/STBPkg/DEBUG_GCC5/FV/*.fd
