name: Build STB UEFI Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout STB Repository
        uses: actions/checkout@v4
        with:
          path: STBPkg

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git uuid-dev iasl nasm python3

      - name: Clone Tianocore EDK II Workspace
        run: |
          git clone --depth 1 https://github.com/tianocore/edk2.git .
          git submodule update --init --depth 1 MdePkg

      - name: Move STB into Workspace Root
        run: |
          mkdir -p STBPkg
          cp -r ../STBPkg/* STBPkg/

      - name: Build BaseTools and Compile Firmware
        run: |
          make -C BaseTools
          export WORKSPACE=$(pwd)
          export EDK_TOOLS_PATH=$WORKSPACE/BaseTools
          source edksetup.sh BaseTools
          build -p STBPkg/STBPkg.dsc -a X64 -t GCC5 -b DEBUG

      - name: Upload Firmware Artifact (.fd)
        uses: actions/upload-artifact@v4
        with:
          name: STB-Firmware-ROM
          path: Build/STBPkg/DEBUG_GCC5/FV/*.fd
