name: Build STB UEFI Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout STB Repository
        uses: actions/checkout@v4
        with:
          path: STBPkg

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git uuid-dev iasl nasm python3

      - name: Clone Tianocore EDK II and All Submodules
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/tianocore/edk2.git edk2-src

      - name: Setup Workspace and Compile
        run: |
          cd edk2-src
          mkdir -p STBPkg
          cp -r ../STBPkg/* STBPkg/
          make -C BaseTools
          export WORKSPACE=$(pwd)
          export EDK_TOOLS_PATH=$WORKSPACE/BaseTools
          source edksetup.sh BaseTools
          build -p STBPkg/STBPkg.dsc -a X64 -t GCC5 -b DEBUG

      - name: Upload Firmware Artifact (.fd)
        uses: actions/upload-artifact@v4
        with:
          name: STB-Firmware-ROM
          path: edk2-src/Build/STBPkg/DEBUG_GCC5/FV/*.fd
